name: Term snippets

# Per-term IRI resolution: every minted term gets a small TTL + JSON-LD document
# so a single entity IRI dereferences to just that term. Snippets are generated
# from the authored ontologies — never hand-edited.
#
# On main: regenerate and commit any drift, so the served snippets always match
#          the committed ontologies.
# On PRs:  verify only. A PR that changes an ontology without regenerating fails
#          here rather than silently shipping stale snippets.

on:
  push:
    branches: [main]
    paths:
      - 'ontology/cco/**.ttl'
      - 'ontology/domains/**.ttl'
      - 'ontology/tools/generate_term_snippets.py'
      - '.github/workflows/generate-term-snippets.yml'
  pull_request:
    paths:
      - 'ontology/cco/**.ttl'
      - 'ontology/domains/**.ttl'
      - 'ontology/tools/generate_term_snippets.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snippets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install 'rdflib>=7.0'

      # Pull requests: verify only. Never push to a contributor's branch.
      - name: Verify snippets match ontologies
        if: github.event_name == 'pull_request'
        run: python ontology/tools/generate_term_snippets.py --check

      - name: Regenerate snippets
        if: github.event_name != 'pull_request'
        run: python ontology/tools/generate_term_snippets.py

      - name: Commit regenerated snippets
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$(git status --porcelain ontology/terms)" ]; then
            echo "Snippets already up to date; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ontology/terms
          # [skip ci] prevents this commit from retriggering the workflow.
          git commit -m "Regenerate term snippets [skip ci]"
          git push
